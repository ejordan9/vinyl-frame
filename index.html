<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark";
    } catch {}
  </script>
  <title>Vinyl Frame — Vinilo & Cuadro E-Ink</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- Subtle paper / E-Ink matte texture overlay -->
  <div class="paper-grain" aria-hidden="true"></div>

  <main class="frame-stage" id="stage" data-mode="vinyl">
    <!-- MODE 1: MD VINYL FULL-SCREEN RECORD PLAYER -->
    <section class="view view-vinyl" id="vinylView" aria-label="Reproductor de vinilo">
      <div class="ambient-album-bg" id="ambientAlbumBg" aria-hidden="true"></div>
      <div class="md-vinyl-stage">
        <!-- Giant Tilted 3D-Flippable Album Sleeve (Left) -->
        <div class="album-sleeve-wrap" id="albumSleeve" role="button" tabindex="0" aria-label="Voltear portada para ver información del artista">
          <div class="album-sleeve-inner">
            <!-- Front: Album Cover -->
            <div class="sleeve-face sleeve-front">
              <div class="album-art" id="albumArt"></div>
              <div class="sleeve-crease" aria-hidden="true"></div>
            </div>
            <!-- Back: Unified Editorial Back Cover (Artist Photo + Tracklist top + Bio bottom) -->
            <div class="sleeve-face sleeve-back">
              <div class="artist-card-bg" id="artistCardBg"></div>
              <div class="artist-card-scrim" aria-hidden="true"></div>
              <div class="back-unified">
                <div class="back-top-tracks">
                  <div class="lp-back-album" id="lpBackAlbum">Album</div>
                  <ol class="lp-track-list" id="sideOneList"></ol>
                </div>
                <div class="artist-card-content">
                  <div class="artist-card-eyebrow">ACERCA DEL ARTISTA</div>
                  <h2 class="artist-card-name" id="artistCardName">Artista</h2>
                  <div class="artist-card-stats" id="artistCardStats"></div>
                  <p class="artist-card-bio" id="artistCardBio">Toca la portada para volver al álbum.</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Giant Spinning Vinyl Disc (Right, overlapping sleeve) -->
        <div class="vinyl-zone">
          <div class="vinyl-disc" id="vinylDisc" role="button" tabindex="0" aria-label="Pausar o reanudar reproducción">
            <div class="vinyl-grooves"></div>
            <div class="vinyl-sheen"></div>
            <div class="vinyl-label" id="vinylLabel">
              <div class="label-art-bg" id="labelArtBg" aria-hidden="true"></div>
              <div class="label-ring"></div>
              <!-- Vintage curved rim text (balanced top & bottom arcs) -->
              <svg class="label-rim-svg" viewBox="0 0 200 200" aria-hidden="true">
                <defs>
                  <path id="rimTop" d="M 13, 100 a 87,87 0 1,1 174,0"/>
                  <path id="rimBottom" d="M 187, 100 a 87,87 0 1,1 -174,0"/>
                </defs>
                <text class="rim-text">
                  <textPath href="#rimTop" startOffset="50%" text-anchor="middle">
                    HIGH FIDELITY • STEREO
                  </textPath>
                </text>
                <text class="rim-text">
                  <textPath href="#rimBottom" startOffset="50%" text-anchor="middle">
                    LONG PLAYING • 33⅓ RPM
                  </textPath>
                </text>
                <text x="26" y="103" class="label-stamp" id="labelYear">℗ 2024</text>
                <text x="174" y="103" text-anchor="end" class="label-stamp" id="labelTrackNum">33⅓ RPM</text>
              </svg>
              <div class="label-text-top">
                <div class="label-title" id="trackTitle">Velvet Rain</div>
              </div>
              <span class="vinyl-spindle"></span>
              <div class="label-text-bottom">
                <div class="label-artist" id="trackArtist">Kaito Morita Quartet</div>
                <div class="label-album" id="labelAlbum">Midnight Pressing</div>
              </div>
            </div>
          </div>

          <!-- Photorealistic Animated Tonearm (Aguja) -->
          <div class="tonearm-assembly" id="tonearm" aria-hidden="true">
            <img src="./tonearm.png" class="tonearm-img" alt="" draggable="false">
          </div>
        </div>
      </div>

      <!-- Integrated Right-Side Vertical Teenage Engineering Deck (Propuesta B) -->
      <div class="side-deck ui-chrome">
        <div class="deck-header">
          <span class="status-dot" id="statusDot"></span>
          <span class="deck-label">DECK</span>
        </div>
        <div class="te-keys-vertical">
          <button type="button" class="te-btn" id="prevBtn" aria-label="Anterior">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><rect x="5" y="4" width="2.5" height="16" rx="0.5"></rect></svg>
          </button>
          <button type="button" class="te-btn te-orange" id="playPauseBtn" aria-label="Pausar o reproducir">
            <svg id="iconPause" viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
            <svg id="iconPlay" viewBox="0 0 24 24" width="17" height="17" fill="currentColor" hidden><polygon points="7 4 20 12 7 20 7 4"></polygon></svg>
          </button>
          <button type="button" class="te-btn" id="nextBtn" aria-label="Siguiente">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><rect x="16.5" y="4" width="2.5" height="16" rx="0.5"></rect></svg>
          </button>
        </div>
      </div>

      <!-- Edge-to-edge bottom hairline progress bar -->
      <div class="edge-progress-wrap ui-chrome">
        <span id="timeCurrent" hidden>1:24</span>
        <span id="timeTotal" hidden>4:12</span>
        <div class="progress-track edge-scale" id="progressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35">
          <div class="progress-fill" id="progressFill"></div>
          <div class="scale-needle" id="scaleNeedle" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <!-- MODE 2: E-INK / THE FRAME AMBIENT ART MODE -->
    <section class="view view-eink" id="einkView" aria-label="Cuadro artístico">
      <div class="eink-canvas" id="einkArtwork"></div>
      <div class="eink-scrim" aria-hidden="true"></div>
      <div class="eink-overlay">
        <div class="eink-caption" id="einkCaption">
          <span class="caption-title" id="artTitle"></span>
          <span class="caption-meta" id="artMeta"></span>
        </div>
        <div class="eink-clock-block">
          <div class="eink-weather-row">
            <span class="eink-weather-icon" id="einkWeatherIcon" aria-hidden="true">☀</span>
            <span class="eink-temp" id="einkWeather">22°</span>
          </div>
          <div class="eink-time" id="einkTime">16:20</div>
        </div>
      </div>
    </section>
  </main>

  <!-- Top-right system icon controls (discreet, 44x44 touch targets) -->
  <nav class="top-dock ui-chrome" aria-label="Controles de marco">
    <button type="button" class="icon-pill-btn" id="sceneCycleBtn" aria-label="Cambiar ilustración" title="Cambiar arte" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
    </button>
    <button type="button" class="icon-pill-btn" id="modeToggleBtn" aria-label="Cambiar modo Vinilo o Cuadro E-Ink" title="Vinilo / Cuadro E-Ink">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="12" cy="12" r="4"></circle></svg>
    </button>
    <button type="button" class="icon-pill-btn" id="fullscreenBtn" aria-label="Pantalla completa" title="Pantalla completa">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
    </button>
    <button type="button" class="icon-pill-btn" id="settingsBtn" aria-label="Ajustes" title="Ajustes">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </nav>

  <!-- Native modal dialog with light-dismiss -->
  <dialog id="settingsDialog" closedby="any" aria-labelledby="settingsTitle">
    <form method="dialog" class="dialog-inner">
      <header class="dialog-header">
        <h2 id="settingsTitle">Ajustes del Marco</h2>
        <button type="submit" class="close-btn" aria-label="Cerrar">✕</button>
      </header>

      <div class="setting-group">
        <label class="setting-label">Apariencia (Papel / Editorial / Atmósfera)</label>
        <div class="segmented segmented-4" role="radiogroup" aria-label="Tema de color">
          <button type="button" class="seg-btn" data-scheme="light dark">Sistema</button>
          <button type="button" class="seg-btn" data-scheme="light">Claro</button>
          <button type="button" class="seg-btn" data-scheme="dark">Oscuro</button>
          <button type="button" class="seg-btn" data-scheme="ambient">Atmósfera</button>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-row">
          <span>Mantener pantalla encendida (Wake Lock)</span>
          <input type="checkbox" id="wakeLockToggle">
        </label>
        <label class="setting-row">
          <span>Pasar a Cuadro E-Ink al pausar (10s)</span>
          <input type="checkbox" id="autoIdleToggle" checked>
        </label>
        <label class="setting-row">
          <span>Auto-ocultar controles al no tocar (6s)</span>
          <input type="checkbox" id="autoHideToggle">
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-label" for="spotifyClientId">Spotify (OAuth PKCE)</label>
        <p class="setting-hint" id="spotifyHint">Agrega <code id="redirectUriPreview"></code> como Redirect URI en developer.spotify.com.</p>
        <div class="input-row">
          <input type="text" id="spotifyClientId" placeholder="Pega tu Spotify Client ID...">
          <button type="button" class="action-btn" id="connectSpotifyBtn">Conectar</button>
        </div>
        <button type="button" class="dock-btn" id="disconnectSpotifyBtn" hidden style="align-self:flex-start;padding-left:0;color:var(--text-muted);">Desconectar Spotify (volver a Demo)</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
